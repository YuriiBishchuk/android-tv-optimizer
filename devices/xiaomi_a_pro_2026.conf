# Xiaomi TV A Pro 2026 — MiTV-MZTU0 (river), MT9676, Android TV 14 (SDK 34)
# Статус: протестовано 2026-09-27. RAM 54 -> 259 МБ (free), Projectivy default.
# ADB-порт динамічний (Wireless Debugging): напр. TV_IP=192.168.0.103:5555
DEVICE_MODEL="MiTV-MZTU0"
DEVICE_CODENAME="river"
DEVICE_MAKER="Xiaomi"
ANDROID_SDK="34"

# 🟢 SAFE_REMOVE — підтверджено безпечні (живий тест 2026-09-27, після ребута не воскресли)
SAFE_REMOVE=(
  "com.xiaomi.statistic"                         # статистика Xiaomi
  "com.xiaomo.tv.milegal"                        # промо-юридичний екран
  "com.xm.webcontent"                            # веб-акції Xiaomi
  "com.xiaomi.android.tvsetup.partnercustomizer" # партнерські промо Google TV
  "com.mitv.tvhome.mitvplus"                     # MiTV+ промо-канали
  "com.mitv.tvhome.michannel"                    # промо-канал лаунчера
  "com.mitv.tvhome.oemtab"                       # OEM-вкладка лаунчера
  "com.mitv.toolhouse"                           # промо-модуль
  "com.xiaomi.tvqs.overseas.y24"                 # промо/QS-модуль
  "com.mitv.overseaservice"                      # overseas-сервіс
  "com.mitv.tvhome.atv"                          # PatchWall (другий лаунчер, ~142МБ RAM)
  "com.miui.tv.analytics"                        # телеметрія (крутилась у фоні!)
  "com.xiaomi.mitv.tvmanager"                    # ТВ-менеджер/чистильник
  "com.android.tv.feedbackconsent"               # зворотний зв'язок Google
  "com.google.android.feedback"                  # зворотний зв'язок Google
  "com.android.federatedcompute.services"        # телеметрія Google
  "com.android.ondevicepersonalization.services" # персоналізація реклами Google
  "com.android.nearby.halfsheet"                 # Nearby-шторка (зайва на ТВ)
  "com.android.printspooler"                     # друк (не потрібен на ТВ)
  "com.google.android.play.games"                # Play Games (мертвий вантаж)
)

# 🟡 OPTIONAL — тільки за вибором власника
OPTIONAL_STREAMING=(
  "com.netflix.ninja"
  "com.netflix.tokenmanager"
  "com.amazon.amazonvideo.livingroom"
  "com.iqiyi.i18n.tv"
  "com.google.android.youtube.tv"
  "com.google.android.youtube.tvmusic"
  "com.megogo.application"
)
OPTIONAL_OTHER=(
  "com.google.android.tts"
  "com.mitv.upgrader"
  "com.xiaomi.mitv.updateservice"
  "com.mitv.gallery"
  "com.mitv.videoplayer"
  "com.mitv.mediaexplorer"
  "com.xiaomi.mimusic2"
  "com.mitv.smartshare"
  "com.mitv.tvhome.scenemode"
)

# 🔴 PROTECTED — ніколи не чіпати
# УВАГА: mitv.service — БЕЗ префікса com. (так в прошивці!), не плутати.
# Документовані брики: mitv.service, tvhome, account.auth.
# Відео-стек: livetv/videoplayer/setup. Fallback HOME: launcherx.
PROTECTED=(
  "mitv.service"
  "com.mitv.tvhome"
  "com.xiaomi.account.auth"
  "com.google.android.gms"
  "com.android.vending"
  "com.google.android.apps.tv.launcherx"
  "com.android.systemui"
  "android"
  "com.mitv.livetv"
  "com.google.android.katniss"
  "com.google.android.apps.tv.mediashell"
  "com.mitv.setup"
  "com.android.bluetooth"
  "com.google.android.webview"
  "com.android.providers.downloads"
  "com.android.certinstaller"
  "com.android.captiveportallogin"
  "com.google.android.tungsten.setupwraith"
)

STOCK_LAUNCHER="com.google.android.apps.tv.launcherx"
PROJECTIVY_PKG="com.spocky.projengmenu"
PROJECTIVY_HOME="com.spocky.projengmenu/.ui.home.MainActivity"

# Тільки disabled (не uninstall): сміттєві тюнери, confirmed 2026-09-27
DISABLE_ONLY=(
  "com.mediatek.dtv.tvinput.isdbtuner"
  "com.iwedia.tvinput"
  "com.mediatek.dtv.tvinput.atsctuner"
  "com.xiaomi.floatingframe"
)
