# Шаблон конфігу пристрою — скопіюй як devices/<vendor>_<model>.conf
# Жодних IP/портів тут немає — вони задаються через ENV (TV_IP) при виклику.
DEVICE_MODEL="Generic Android TV"
DEVICE_CODENAME="generic"
DEVICE_MAKER="Generic"
ANDROID_SDK="34"

# 🟢 SAFE_REMOVE — uninstall --user 0, відновлюється через install-existing
SAFE_REMOVE=(
  # "com.example.telemetry"
)

# 🟡 OPTIONAL — тільки за явною згодою власника
OPTIONAL_STREAMING=(
)

OPTIONAL_OTHER=(
)

# 🔴 PROTECTED — ніколи не чіпати (брики / відео-стек / fallback HOME)
PROTECTED=(
  "android"
  "com.android.systemui"
  "com.android.vending"
  "com.google.android.gms"
  "com.google.android.apps.tv.launcherx"
)

# HOME-лаунчер
STOCK_LAUNCHER="com.google.android.apps.tv.launcherx"
PROJECTIVY_PKG="com.spocky.projengmenu"
PROJECTIVY_HOME="com.spocky.projengmenu/.ui.home.MainActivity"
